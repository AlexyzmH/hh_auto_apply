<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Резюме клиента {{ customer_id }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
  <div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">👤 Клиент: {{ customer_id }}</h1>

    {% if resumes %}
      <h2 class="text-xl mb-2">Выберите резюме:</h2>
      <ul class="space-y-2">
        {% for resume in resumes %}
          <li class="bg-white p-4 rounded shadow">
            <div class="flex justify-between items-center">
              <div>
                <p class="font-semibold">{{ resume.title }}</p>
                <p class="text-sm text-gray-600">ID: {{ resume.id }}</p>
              </div>
              <form method="get" action="/search">
                <input type="hidden" name="customer_id" value="{{ customer_id }}">
                <input type="hidden" name="resume_id" value="{{ resume.id }}">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                  🔍 Выбрать
                </button>
              </form>
            </div>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="text-gray-600">У клиента нет резюме.</p>
    {% endif %}

    <div class="mt-6">
      <a href="/" class="text-blue-600 hover:underline">← Назад</a>
    </div>
  </div>
</body>
</html>
