<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Поиск вакансий</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="max-w-3xl mx-auto py-10 px-4">
    <h1 class="text-3xl font-bold mb-6">🔍 Поиск вакансий</h1>
    <form id="searchForm" class="space-y-4 bg-white p-6 rounded-xl shadow">
      <input type="hidden" name="customer_id" value="{{ customer_id }}">

      <div>
        <label class="block font-medium">Ключевые слова:</label>
        <input type="text" name="text" class="w-full mt-1 p-2 border rounded">
      </div>

      <div>
        <label class="block font-medium">Регион (area ID):</label>
        <input type="text" name="area" class="w-full mt-1 p-2 border rounded">
      </div>

      <div>
        <label class="block font-medium">Искать в:</label>
        <div class="flex space-x-4 mt-1">
          <label><input type="checkbox" name="search_field" value="name" class="mr-1">Название</label>
          <label><input type="checkbox" name="search_field" value="company_name" class="mr-1">Компания</label>
          <label><input type="checkbox" name="search_field" value="description" class="mr-1">Описание</label>
        </div>
      </div>

      <div>
        <label class="block font-medium">Исключить слова:</label>
        <input type="text" name="not_word" class="w-full mt-1 p-2 border rounded">
      </div>

      <div>
        <label class="block font-medium">Специализация:</label>
        <input type="text" name="specialization" class="w-full mt-1 p-2 border rounded">
      </div>

      <div>
        <label class="block font-medium">Опыт:</label>
        <select name="experience" class="w-full mt-1 p-2 border rounded">
          <option value="">--</option>
          <option value="noExperience">Нет опыта</option>
          <option value="between1And3">1–3 года</option>
          <option value="between3And6">3–6 лет</option>
          <option value="moreThan6">Более 6 лет</option>
        </select>
      </div>

      <div>
        <label class="block font-medium">Тип занятости:</label>
        <select name="employment" class="w-full mt-1 p-2 border rounded">
          <option value="">--</option>
          <option value="full">Полная</option>
          <option value="part">Частичная</option>
          <option value="project">Проектная</option>
          <option value="volunteer">Волонтёрство</option>
          <option value="probation">Стажировка</option>
        </select>
      </div>

      <div>
        <label class="block font-medium">График:</label>
        <select name="schedule" class="w-full mt-1 p-2 border rounded">
          <option value="">--</option>
          <option value="fullDay">Полный день</option>
          <option value="shift">Сменный</option>
          <option value="flexible">Гибкий</option>
          <option value="remote">Удалёнка</option>
          <option value="flyInFlyOut">Вахта</option>
        </select>
      </div>

      <div>
        <label class="block font-medium">Зарплата от:</label>
        <input type="number" name="salary" class="w-full mt-1 p-2 border rounded">
      </div>

      <div>
        <label class="inline-flex items-center">
          <input type="checkbox" name="only_with_salary" value="true" class="mr-2">
          Только с указанной зарплатой
        </label>
      </div>

      <!-- ✅ Мультивыбор -->
      <div class="mb-4">
        <label class="block font-medium mb-1">Регион:</label>
        <button type="button" onclick="openRegionModal()"
          class="bg-gray-200 px-3 py-2 rounded hover:bg-gray-300">
          📍 Выбрать регион
        </button>

        <!-- Теги выбранных -->
        <div id="selected-region-tags" class="flex flex-wrap gap-2 mt-2 text-sm text-gray-800"></div>

  <!-- Скрытое поле -->
  <input type="hidden" name="area" id="selected-area-ids">
</div>


      <!-- 🗺️ Модалка -->
      <div id="region-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden z-50 flex items-center justify-center">
        <div class="bg-white max-h-[80vh] w-[90vw] max-w-2xl overflow-y-auto rounded shadow-lg p-4 relative">
          <button type="button" onclick="closeRegionModal()" class="absolute top-2 right-2 text-gray-500 hover:text-black">✖</button>
          <h2 class="text-xl font-bold mb-2">Выберите регион</h2>
          <!--<input type="text" id="region-search" placeholder="Поиск..." class="w-full p-2 border mb-4 rounded"> -->

          <ul id="region-tree" class="space-y-1 text-sm text-gray-800"></ul>
        </div>
      </div>

      <div>
        <label class="block font-medium">Сопроводительные письма (до 3):</label>
        <textarea name="cover_letters" rows="6" class="w-full mt-1 p-2 border rounded" placeholder="Введите сопровидетельное письмо ---"></textarea>
        <!--<p class="text-sm text-gray-500 mt-1">Разделяйте письма с помощью `---`. Одно из них будет выбрано случайно при отклике.</p> -->
      </div>


      <div>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Поиск</button>
      </div>

      <div class="mt-4">
        <a href="/customer/{{ customer_id }}" class="text-blue-600 hover:underline">← Назад к выбору резюме</a>
      </div>

    </form>

    <div class="mt-8">
      <h2 class="text-xl font-semibold mb-2">📄 Результаты:</h2>

      <div id="results" class="space-y-4"></div>

    </div>
  </div>

  <script>
  let lastCustomer = document.querySelector('input[name="customer_id"]').value;

  document.getElementById('searchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const params = new URLSearchParams();
    for (const [key, value] of formData.entries()) {
    if (key === 'area') {
      const areaValues = value.split(','); // "1,2,3"
      for (const a of areaValues) {
        if (a) params.append('area', a); // ✅ area=1&area=2
      }
    } else if (value) {
      params.append(key, value);
    }
  }
    console.log("📦 GET /vacancies?" + params.toString());

    const results = document.getElementById('results');
    results.innerHTML = '<p class="text-gray-500">🔄 Загружаем вакансии...</p>';

    try {
      const res = await fetch(`/vacancies?${params.toString()}`);
      const data = await res.json();
      renderVacancies(data.items || []);
    } catch (err) {
      results.innerHTML = '<p class="text-red-600">❌ Ошибка загрузки</p>';
    }
  });

  function renderVacancies(vacancies) {
    const results = document.getElementById('results');
    results.innerHTML = '';

    if (vacancies.length === 0) {
      results.innerHTML = '<p class="text-gray-500">🔍 Вакансии не найдены</p>';
      return;
    }

    for (const v of vacancies) {
      const salary = v.salary ?
        `${v.salary.from || ''} – ${v.salary.to || ''} ${v.salary.currency}` :
        'Не указана';

      const company = v.employer?.name || 'Без компании';
      const city = v.area?.name || 'Город не указан';
      const url = v.alternate_url || '#';
      const vacancyId = v.id;

      const card = document.createElement('div');
      card.className = 'border p-4 rounded-lg shadow bg-white';

      card.innerHTML = `
        <h3 class="text-xl font-semibold text-blue-700 hover:underline">
          <a href="${url}" target="_blank">${v.name}</a>
        </h3>
        <p class="text-gray-700">💼 ${company}</p>
        <p class="text-gray-700">📍 ${city}</p>
        <p class="text-gray-700">💰 Зарплата: ${salary}</p>
        <div class="mt-2 flex items-center gap-2">
          <button class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded"
            onclick="respondToVacancy('${vacancyId}')">
            Откликнуться
          </button>
          <span id="respond-status-${vacancyId}" class="text-sm text-gray-500"></span>
        </div>
      `;

      results.appendChild(card);
    }
  }

  async function respondToVacancy(vacancyId) {
  const status = document.getElementById(`respond-status-${vacancyId}`);
  status.textContent = "⏳ Откликаемся...";

  try {
    const rawLetters = document.querySelector('textarea[name="cover_letters"]')?.value || "";
    let letters = rawLetters.split('---').map(l => l.trim()).filter(l => l.length > 0);
    let message = letters.length > 0 ? letters[Math.floor(Math.random() * letters.length)] : null;

    const payload = {
      customer_id: lastCustomer,
      vacancy_id: vacancyId
    };
    if (message) {
      payload.message = message;
    }

    const res = await fetch('/respond', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    console.log("📡 Status code:", res.status);
    const text = await res.text();

    let data = {};
    try {
      data = JSON.parse(text);
    } catch (e) {
      console.log("⚠️ Не JSON тело:", e);
    }

    if (res.status === 201) {
      status.textContent = "✅ Успешно откликнулись!";
      status.className = "text-sm text-green-600";

    } else if (res.status === 303) {
      const link = data.manual_url || "#";
      status.innerHTML = `🔀 Вакансия требует ручного отклика:
        <a href="${link}" target="_blank" class="text-blue-600 underline">Открыть на HH</a>`;
      status.className = "text-sm text-yellow-600";

    } else if (res.status === 403) {
      const reason = data?.reason || "";
      if (reason === "test_required") {
        status.textContent = "📋 Требуется пройти тест перед откликом";
      } else {
        status.textContent = "⚠️ Вы уже откликались ранее";
      }
      status.className = "text-sm text-red-600";

    } else if (res.status === 400) {
      status.textContent = `❌ Неверный запрос: ${data?.error || 'Проверь резюме'}`;
      status.className = "text-sm text-red-600";

    } else {
      status.textContent = `❌ Неизвестная ошибка (${res.status})`;
      status.className = "text-sm text-red-600";
    }

  } catch (err) {
    console.log("🔥 Ошибка в try:", err);
    status.textContent = "❌ Ошибка сети или сервера";
    status.className = "text-sm text-red-600";
  }
}


</script>

<script>

function closeRegionModal() {
  document.getElementById('region-modal').classList.add('hidden');
}

let areaData = [];
let selectedAreas = []; // массив объектов {id, name}

function openRegionModal() {
  document.getElementById('region-modal').classList.remove('hidden');
  if (!areaData.length) loadRegions();
}

function closeRegionModal() {
  document.getElementById('region-modal').classList.add('hidden');
}

async function loadRegions() {
  const res = await fetch("https://api.hh.ru/areas");
  areaData = await res.json();
  renderRegionTree(areaData);
}

function renderRegionTree(data) {
  const tree = document.getElementById('region-tree');
  tree.innerHTML = '';

  const russia = data.find(c => c.name === 'Россия');
  const moscow = russia.areas.find(r => r.name === 'Москва');
  const spb = russia.areas.find(r => r.name === 'Санкт-Петербург');

  // 👉 Добавляем Москву и СПБ вручную
  [moscow, spb].forEach(city => {
    if (!city) return;
    const li = document.createElement('li');
    li.innerHTML = `
      <label class="inline-flex items-center space-x-2">
        <input type="checkbox" value="${city.id}" onchange="toggleArea('${city.id}', '${city.name}')">
        <span>${city.name}</span>
      </label>
    `;
    tree.appendChild(li);
  });

  // 👉 Остальные регионы
  for (const region of russia.areas) {
    if ([moscow.id, spb.id].includes(region.id)) continue;

    const regionItem = document.createElement('li');

    if (region.areas.length === 0) {
      // Регион без городов
      regionItem.innerHTML = `
        <label class="inline-flex items-center space-x-2">
          <input type="checkbox" value="${region.id}" onchange="toggleArea('${region.id}', '${region.name}')">
          <span>${region.name}</span>
        </label>
      `;
    } else {
      // Регион с городами
      regionItem.innerHTML = `
        <details>
          <summary class="cursor-pointer font-semibold">${region.name}</summary>
          <ul class="ml-4 mt-1 space-y-1">
            <li>
              <label class="inline-flex items-center space-x-2">
                <input type="checkbox" value="${region.id}" onchange="toggleArea('${region.id}', '${region.name}')">
                <span>📍 ${region.name} (весь регион)</span>
              </label>
            </li>
            ${region.areas.map(city => `
              <li>
                <label class="inline-flex items-center space-x-2">
                  <input type="checkbox" value="${city.id}" onchange="toggleArea('${city.id}', '${city.name}')">
                  <span>${city.name}</span>
                </label>
              </li>
            `).join('')}
          </ul>
        </details>
      `;
    }

    tree.appendChild(regionItem);
  }
}


function toggleArea(id, name) {
  const exists = selectedAreas.find(a => a.id === id);
  if (exists) {
    selectedAreas = selectedAreas.filter(a => a.id !== id);
  } else {
    selectedAreas.push({ id, name });
  }
  updateSelectedTags();
}

function updateSelectedTags() {
  const container = document.getElementById('selected-region-tags');
  const hiddenInput = document.getElementById('selected-area-ids');
  container.innerHTML = '';

  for (const area of selectedAreas) {
    const tag = document.createElement('span');
    tag.className = 'bg-gray-200 px-2 py-1 rounded flex items-center gap-1';
    tag.innerHTML = `${area.name}
      <button type="button" onclick="removeArea('${area.id}')" class="text-red-600 hover:text-red-800">✖</button>`;
    container.appendChild(tag);
  }

  hiddenInput.value = selectedAreas.map(a => a.id).join(',');
}

function removeArea(id) {
  selectedAreas = selectedAreas.filter(a => a.id !== id);
  updateSelectedTags();

  // снять чекбокс, если открыт
  const checkbox = document.querySelector(`#region-tree input[type="checkbox"][value="${id}"]`);
  if (checkbox) checkbox.checked = false;
}

document.getElementById('region-search').addEventListener('input', function () {
  const query = this.value.toLowerCase();
  const spans = document.querySelectorAll('#region-tree label span');

  spans.forEach(span => {
    const match = span.textContent.toLowerCase().includes(query);
    span.closest('li').style.display = match ? '' : 'none';
  });
});


</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const textarea = document.querySelector('textarea[name="cover_letters"]');
  if (textarea && !textarea.value.trim()) {
    textarea.value = `Ознакомился с вашей вакансией. Имею необходимые навыки и опыт. Готов поделиться своим опытом и обсудить возможное сотрудничество`;
  }
});
</script>


</body>
</html>
