<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SmartApply – Клиенты</title>
</head>
<body>
    <h1>SmartApply</h1>
    <h2>Выберите клиента</h2>

        {% for cid in customers %}
            <li>
                <a href="/search?customer_id={{ cid }}">{{ cid }}</a>

        {% endfor %}
    </ul>
    <hr>
    <a href="/login">
        <button>➕ Новый пользователь</button>
    </a>
</body>
</html>
